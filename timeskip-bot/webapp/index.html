<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>TimeSkip</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <button class="back press" id="back" type="button" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
    </button>
    <h1 id="title">TimeSkip</h1>
    <div class="balance" id="balance" aria-label="Фишки">
      <span class="coin" aria-hidden="true"></span><b id="balance-value">…</b>
    </div>
  </header>

  <main id="screen"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="note">Для игр нужен JavaScript.</p></noscript>
</body>
</html>
